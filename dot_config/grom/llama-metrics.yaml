# grom dashboard for the two llama.cpp routers.
#
# Prometheus scrapes ornith (:8081) every 15s (see /etc/prometheus/prometheus.yml;
# the `llama-little-brother` job on :8082 was removed: its metrics requests
# reload Sage on card 2 — the router proxies them to the child instance and
# unloads the model when idle, so each scrape forced a full model reload).
# Both are router servers, so Prometheus fetches them with ?model=
# InternScience/Sage-A1.5-Q4_K_M-GGUF:Q4_K_M, which is the model loaded on
# both right now. The metrics are per-model-instance: cumulative since the
# child instance of that model started.
#
# Run: grom run --config ~/.config/grom/llama-metrics.yaml --prom http://127.0.0.1:9090
title: llama.cpp
theme: tokyo-night
refresh: 10s
range: 1h

widgets:
  # Row 1 — headline stats.
  - type: stat
    title: prompt tokens (ornith :8081)
    unit: short
    sparkline: true
    grid: { x: 0, y: 0, w: 6, h: 4 }
    queries:
      - expr: llamacpp:prompt_tokens_total{job="llama-cuda"}


  - type: stat
    title: decode total (ornith)
    unit: short
    sparkline: true
    grid: { x: 12, y: 0, w: 6, h: 4 }
    queries:
      - expr: llamacpp:n_decode_total{job="llama-cuda"}


  # Row 2 — live load + tokens predicted.
  - type: stat
    title: requests processing (ornith)
    unit: short
    sparkline: true
    grid: { x: 0, y: 4, w: 6, h: 4 }
    queries:
      - expr: llamacpp:requests_processing{job="llama-cuda"}


  - type: stat
    title: tokens predicted (ornith)
    unit: short
    sparkline: true
    grid: { x: 12, y: 4, w: 6, h: 4 }
    queries:
      - expr: llamacpp:tokens_predicted_total{job="llama-cuda"}


  # Row 3 — prompt tokens over time.
  - type: timeseries
    title: prompt tokens / s (ornith :8081)
    unit: short
    grid: { x: 0, y: 8, w: 12, h: 8 }
    queries:
      - expr: rate(llamacpp:prompt_tokens_total{job="llama-cuda"}[5m])
        legend: "{{job}}"

  # Row 4 — decode over time.
  - type: timeseries
    title: decode / s (ornith :8081)
    unit: short
    stacked: true
    grid: { x: 0, y: 16, w: 12, h: 8 }
    queries:
      - expr: rate(llamacpp:n_decode_total{job="llama-cuda"}[5m])
        legend: "{{job}}"

  # Row 5 — prompt seconds (time spent prompting).
  - type: timeseries
    title: prompt seconds (cumulative)
    unit: s
    grid: { x: 12, y: 8, w: 12, h: 8 }
    queries:
      - expr: llamacpp:prompt_seconds_total{job="llama-cuda"}
