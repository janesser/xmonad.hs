# Sample config for Prometheus.

global:
  scrape_interval:     15s # Set the scrape interval to every 15 seconds. Default is every 1 minute.
  evaluation_interval: 15s # Evaluate rules every 15 seconds. The default is every 1 minute.
  # scrape_timeout is set to the global default (10s).

  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager).
  external_labels:
      monitor: 'example'

# Alertmanager configuration
alerting:
  alertmanagers:
  - static_configs:
    - targets: ['localhost:9093']

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# A scrape configuration containing exactly one endpoint to scrape:
# Here it's Prometheus itself.
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'prometheus'

    # Override the global default and scrape targets from this job every 5 seconds.
    scrape_interval: 5s
    scrape_timeout: 5s

    # metrics_path defaults to '/metrics'
    # scheme defaults to 'http'.

    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    # If prometheus-node-exporter is installed, grab stats about the local
    # machine by default.
    static_configs:
      - targets: ['localhost:9100']

  # llama.cpp router (ornith, :8081) on NVIDIA CUDA0. Both llama.cpp routers
  # here are *router* servers: the /metrics endpoint only answers when a
  # ?model= query param is given — the request is proxied to the child
  # instance of that model. The model is already loaded, so the scrape is
  # fast; if it were unloaded the router would load it (models_autoload=true).
  - job_name: llama-cuda
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['127.0.0.1:8081']
    params:
      model: ['InternScience/Sage-A1.5-Q4_K_M-GGUF:Q4_K_M']

  # NOTE: scrape with `?autoload=false` — if Sage isn't loaded the router returns
  # 500 instead of reloading it. Prometheus then shows down when the model is
  # gone, and never forces a reload while it is loaded.
  - job_name: llama-little-brother
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['127.0.0.1:8082']
    params:
      model: ['InternScience/Sage-A1.5-Q4_K_M-GGUF:Q4_K_M']
      autoload: ['false']
