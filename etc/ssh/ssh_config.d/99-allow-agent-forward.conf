# Managed by chezmoi.
#
# Drop-in for /etc/ssh/ssh_config.d, deployed by
# run_onchange_sudo_ssh_config.sh.tmpl. It enables SSH agent forwarding for the
# client. It is only read if /etc/ssh/ssh_config contains
#
#     Include /etc/ssh/ssh_config.d/*.conf
#
# which is present by default on Debian/Ubuntu.
#
# The client-side keyword is ForwardAgent (see ssh_config(5)). NOTE:
# AgentForwarding and AllowAgentForwarding are NOT valid here — they are
# sshd_config (server-side) options and the ssh client rejects them
# ("Bad configuration option").
#
# Edit this file to change the desired state; the run script only re-runs when
# its content changes (sha256 gate).

ForwardAgent yes
