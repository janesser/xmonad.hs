# mise global config (replaces the asdf tool/version manager).
# Single source of truth for tool versions. Read by mise from ANY working
# directory (unlike ~/mise.toml or .tool-versions, which only apply inside ~).
# See mise-migration-plan.md.
[tools]
uv      = "latest"
helm    = "4.3.1"
kubectl = "1.37.1"
maven   = "3.10.0"
java    = "temurin-26.0.2+101"
zellij  = "0.45.1"
pi = "latest"
node  = "26.12.0"
