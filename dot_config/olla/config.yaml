# Olla config — public entry on :8080 -> llama.cpp backend.
#
# This box (lincopta) is CUDA-only, so there is a single llama.cpp backend:
#
#   * :8081  CUDA / NVIDIA  (restart-llama-cuda.sh)  -> ornith-1.5 9B
#
# Olla binds 0.0.0.0:8080 (actually :40114) here and routes each request to the
# endpoint whose reported model matches. The endpoint is static below.
#
# The SYCL / Intel backend (:8082) is intentionally absent: this machine has no
# Intel GPU. If an Intel backend is ever deployed, add a :8082 endpoint back —
# the backend's port/model are configurable (see restart-llama-cuda.sh).
#
# Why type: "openai-compatible" (NOT "llamacpp"):
#   Olla v0.0.29's "llamacpp" profile parses llama.cpp's *native* /v1/models
#   "data[]" array whose "meta":{"vocab_type":true,...} is a boolean on this
#   llama.cpp build (0.4.1-dev, build 11060) but an integer on older ones.
#   Olla 0.0.29's Go parser expects an integer -> discovery fails and every
#   request is rejected. The OpenAI "models[]" array has no "meta" and parses
#   cleanly.
#
# The model is referenced by the exact name llama.cpp reports (the --model path,
# shortened via a symlink in the launcher: restart-llama-cuda.sh for the CUDA
# backend. LLAMA_MODEL_NAME sets it (default: ornith-1.5-9B.gguf); it may also be
# an HF repo, downloaded on first use. Olla matches requests to an endpoint by
# this exact id.
server:
  # Dual-stack on Linux (bindv6only=0): accepts IPv4 AND IPv6 clients, so LAN
  # IPv6 clients (e.g. http://[fd4c:468d:6524::<this host>]:8080) work too.
  # NOTE: use "[::]" with brackets. Olla concatenates host+":"+port with no
  # IPv6 bracketing, so a bare "::" becomes ":::8080" which Go rejects
  # ("too many colons"). Brackets yield the valid "[::]:8080". (Olla 0.0.29.)
  host: "[::]"
  port: 40114

discovery:
  type: "static"
  static:
    endpoints:
      # Single llama.cpp backend on this box (CUDA-only). Add a :8082 SYCL
      # endpoint back only if an Intel backend is ever deployed here.
      - url: "http://127.0.0.1:8081"   # llama.cpp server (restart-llama-cuda.sh)
        name: "local-llamacpp-cuda"
        type: "openai-compatible"
        priority: 100
