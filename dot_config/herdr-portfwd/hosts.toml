# herdr-portfwd host list
#
# Every host the plugin should know about — the SSH target the plugin dials
# through (anything `ssh` accepts: alias, user@host, ssh://host:2222).
#
# This file is rendered by chezmoi into ~/.config/herdr-portfwd/hosts.toml on
# every box, because the plugin reads the first hosts.toml it finds on the
# machine the command runs on:
#
#   1. ~/.config/herdr-portfwd/hosts.toml
#   2. ~/.config/herdr-mirror/hosts.toml
#
# The list is the same on every box — the remote plugin scans its own hosts,
# the local agent applies the forwards.
#
# TODO: this file exposes the LAN topology. It must be an age-encrypted blob
# (dot_config/herdr-portfwd/hosts.toml -> encrypted_dot_config/...) before it
# is pushed to every host.

[hosts.cyberkleiber]
target = "cyberkleiber"
prefix = "kleiber"

[hosts.raspberrypi]
target = "raspberrypi"
prefix = "pi"

[hosts.no5]
target = "no5.wan"
prefix = "no5"

[hosts.lincopta]
target = "lincopta.wan"
prefix = "lincopta"

[hosts.peacewagon]
target = "peacewagon"
prefix = "peace"
