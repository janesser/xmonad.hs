# Managed by chezmoi.
#
# Drop-in for /etc/ssh/sshd_config.d, deployed by
# run_once_0_sshd_hardening.sh to
# /etc/ssh/sshd_config.d/10-raspberrypi-hardening.conf (raspberrypi only —
# the deploy script is hostname-guarded).
#
# It is only read if /etc/ssh/sshd_config contains
#
#     Include /etc/ssh/sshd_config.d/*.conf
#
# which is present by default on Debian, and the Include sits at the top of
# the file. sshd uses first-match-wins, so these drop-in values override the
# later lines in /etc/ssh/sshd_config (which ships X11Forwarding yes).
#
# Why: port 22 is reachable from the WAN (fritzbox forwarding) and the
# journal shows password brute-force attempts from public IPs. Keys-only
# auth removes the password channel; jan's key login was verified before
# applying. See hardening review of 2026-11-20.

PasswordAuthentication no
X11Forwarding no
