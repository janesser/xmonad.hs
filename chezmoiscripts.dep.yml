# =============================================================================
# chezmoiscripts MANIFEST  (single source of truth for ordering & dependencies)
# =============================================================================
#
# WHY THIS FILE
#   `.chezmoiscripts/*.sh` scripts run in LEXICOGRAPHIC order of their full
#   filename, within each phase. The leading keywords pick the PHASE; everything
#   after that is a HUMAN LAYERING that only works because sorting is string-based:
#
#     <phase>_<tier>_<label>_<suborder>[-<os>]-<shell>[:.tmpl]
#
#       run_once   -> run-once (chezmoi drops a marker file, so it runs once)
#       run        -> every apply
#       run_onchange -> re-run when the referenced source files change (sha256 marker)
#       _template  -> rendered via templating before being copied/executed
#       <tier>     -> dependency TIER (0 = foundations .. 5 = ai tools)
#       <label>    -> human-readable group (essentials, fish, devtools, ...)
#       <suborder> -> ordering WITHIN the tier (0,1,2,6 ...)
#
#   The numbers are NOT parsed by chezmoi — they only order the sort. Because the
#   sort is string-based, a two-digit tier (e.g. run_once_10_...) would sort
#   BETWEEN run_once_1_... and run_once_2_..., NOT after run_once_9_. Keep tiers
#   single-digit (0-9) until this is migrated to a parsed scheme.
#
# ENFORCEMENT (optional)
#   A CI check can assert that every `depends_on` entry sorts before its own
#   filename. See scripts/check_manifest_order.py (optional helper).
#
# LEGEND — tiers
#   0  foundations / essentials (apt, mise, python, terminal emulator, precommit)
#   1  fish shell ecosystem + system daemons (clamfs, pipewire, fish + plugins/theme)
#   2  desktop apps & browsers (codium, ghcup, logseq, browsers, nextcloud, ...)
#   3  developer tooling (git/gcm, java, k8s, podman, github-act, jupyter, node, rust, helix)
#   4  laptop / rp hardware tweaks (lightdm, EDID fix, HP/RPi tweaks)
#   5  AI tooling (llama.cpp, MCP servers, agentic, image generation)
#   run 0 / run 9  housekeeping that runs on every apply (assert + cleanup/update)
#   run_onchange  re-sync apt sources when their source files change
#
# DEPENDENCY EDGES (verified by static analysis of each script, 2026-09)
#   Only edges whose dependency SORTS BEFORE the dependent are encoded here, so
#   they stay consistent with chezmoi's filename sort. Reverse edges are documented
#   in `analysis_notes` and intentionally NOT encoded (they would break the sort).
#
# NOTE: `provides` = concrete packages/binaries each script installs (from static
#   analysis). `depends_on` = scripts that must run earlier for this one to work.
#   Both are analysis-derived, not from a static binary-dependency solver.

manifest_version: 1
default_shell: bash
sort: lexicographic_by_filename

