# =============================================================================
# STATIC-ANALYSIS NOTES  (from reading every script, 2026-09)
# =============================================================================
#
# 1. run_* sorts BEFORE run_once_*.  After the "run_" prefix, '9' (0x39) and
#    '0' (0x30) both sort before 'o' (0x6f) of "once". So the ordering on disk is
#    run_0_assert...  run_9_cleanup_* / run_9_update_*  then  run_once_0_...
#    Consequence: housekeeping (run_9_update_*) runs on EVERY apply BEFORE the
#    run_once_* installs. On a cold first apply several updates target a binary
#    that does not exist yet:
#      - run_9_update_nala.sh      -> nala installed by run_once_2_nala_install.sh
#      - run_9_update_rust.sh      -> rustup installed by run_once_3_devtools_5rust.sh
#      - run_9_update_fish.sh      -> fish  installed by run_once_1_fish_0install.sh
#      - run_9_update_flatpak.sh   -> flatpak installed by run_once_2_logseq_install.sh
#      - run_9_cleanup_podman.sh   -> podman  installed by run_once_3_devtools_3podman...
#      - run_9_cleanup_uv.sh       -> uv      installed by run_once_0_python_tools_install.sh
#    All non-fatal (no `set -e`); the command just errors and continues. Intentional.
#
# 2. Reverse (unencodable) deps: mise & python-tools (tier 0) call `mise activate`
#    before tier 1 fish is installed. This works only because run_once markers
#    persist across applies; a truly cold first apply runs tier 0 before tier 1 fish.
#    Not encoded as depends_on because it would put a tier-0 script depending on a
#    tier-1 script, breaking the sort.
#
# 3. Verified cross-script runtime deps (all encode cleanly — dependency sorts first):
#      mise consumers  -> run_once_0_mise_install.sh : python_tools, java, k8s, node
#      fish completions-> run_once_1_fish_0install.sh : fish_1completion, fish_2fisher, fish_2theme
#      codium extensions -> run_once_2_codium_0install.sh
#    Every other script's dependencies are external (apt/snap/go/cargo/uv/npm/flatpak
#    /external URLs) or conditional on env vars, so no file-level edge is needed.
#
# 4. Clean as of this regen: the old asdf scripts, run_9_update_pi, and the
#    run_once_5_aitools_4image_gen (dead `exit 0`) entry were removed from the
#    manifest and no longer exist on disk. No dead-code flags remaining.
