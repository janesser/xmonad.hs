# Managed by chezmoi.
#
# Point SSH_AUTH_SOCK at the live system ssh-agent (the systemd user service
# `ssh-agent.service` is started by `.chezmoiscripts/run_after_ssh_agent.sh`,
# which itself is run by `cz apply` on every pass).
#
# This replaces the previous value (`~/.config/herdr/herdr.sock.agent`), which
# was a symlink to a dead socket and made every ssh/git/ssh-add command fail
# with "Error connecting to agent".
#
# The agent socket is created by the user-level systemd service:
#   /run/user/1000/ssh-agent.socket
#
# NOTE: this file is read by systemd user units and by
# `systemctl --user import-environment` / dbus-user-session startup. If a
# service started before the agent (e.g. a daemon that inherits the environment
# from the display manager) needs the agent, start that service after the agent
# is available.

SSH_AUTH_SOCK=/run/user/1000/ssh-agent.socket
