# Olla config — public entry on :8080 -> llama.cpp backend.
#
# Two llama.cpp backends, localhost-only, so Olla can own the public port:
#
#   * :8081  CUDA / NVIDIA V100  (restart-llama-cuda.sh)  -> ALL llama-cuda models
#   * :8082  SYCL / Intel DG1-IrisXe (restart-llama-sycl.sh) -> LFM2.5-2.6B (Q4_K_M)
#
# :8081 runs ONE llama.cpp router server. llama.cpp loads only
# one model into VRAM at a time; selecting a model loads it on demand. The served
# portfolio is discovered from the bind-mounted HF cache
# (~/.cache/huggingface/hub) -- no preset file.
#
# Olla discovers each served model from /v1/models (dynamic discovery is ON), so it
# exposes the full llama-cuda portfolio automatically — no per-model entry needed.
# Reported ids are the HF-cache repo ids (e.g.
# deepreinforce-ai/Ornith-1.5-35B-A3B-GGUF:Q4_K_M) -- update any client that pinned
# the old ~/.cache/huggingface/hub/ornith.gguf path.
# Olla binds 0.0.0.0:8080 (actually :40114) here and routes each request to the
# endpoint whose reported model matches. Both endpoints are static below.
#
# Why type: "openai-compatible" (NOT "llamacpp"):
#   Olla v0.0.29's "llamacpp" profile parses llama.cpp's *native* /v1/models
#   "data[]" array whose "meta":{"vocab_type":true,...} is a boolean on this
#   llama.cpp build (0.4.1-dev, build 11060) but an integer on older ones.
#   Olla 0.0.29's Go parser expects an integer -> discovery fails and every
#   request is rejected. The OpenAI "models[]" array has no "meta" and parses
#   cleanly.
#
# The model is referenced by the exact name llama.cpp reports (the --model path,
# shortened via a symlink in the launcher: restart-llama-cuda.sh for the CUDA
# backend (ornith.gguf), restart-llama-sycl.sh for the SYCL backend
# (LFM2.5-2.6B.gguf). Olla matches requests to an endpoint by this exact id.
server:
  # Dual-stack on Linux (bindv6only=0): accepts IPv4 AND IPv6 clients, so LAN
  # IPv6 clients (e.g. http://[fd4c:468d:6524::<this host>]:8080) work too.
  # NOTE: use "[::]" with brackets. Olla concatenates host+":"+port with no
  # IPv6 bracketing, so a bare "::" becomes ":::8080" which Go rejects
  # ("too many colons"). Brackets yield the valid "[::]:8080". (Olla 0.0.29.)
  host: "[::]"
  port: 40114

discovery:
  type: "static"
  static:
    endpoints:
      - url: "http://127.0.0.1:8081"   # llama.cpp server (restart-llama-cuda.sh)
        name: "local-llamacpp-cuda"
        type: "openai-compatible"
        priority: 100
      - url: "http://127.0.0.1:8082"   # llama.cpp server on the Intel GPU (restart-llama-sycl.sh)
        name: "local-llamacpp-sycl"
        type: "openai-compatible"
        priority: 90
      - url: "http://127.0.0.1:8091"   # vLLM-Omni (restart-vllm-omni.sh) on the V100
        name: "vllm-omni"
        type: "openai-compatible"
        priority: 50
        # vLLM-Omni shares the V100 with the llama.cpp CUDA backend (:8081,
        # ornith): only ONE can hold the V100 at a time. This endpoint is only
        # live while vLLM-Omni is running (switch-ai-backend.sh omni); while it
        # is down Olla keeps routing ornith (it won't route a model it cannot
        # discover). See ai-server.md §13.
