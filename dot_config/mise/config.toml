# mise global config (replaces the asdf tool/version manager).
# Single source of truth for tool versions. Read by mise from ANY working
# directory (unlike ~/mise.toml or .tool-versions, which only apply inside ~).
# See mise-migration-plan.md.
[tools]
uv      = "0.12.17"
helm    = "4.3.0"
kubectl = "1.37.0"
maven   = "3.9.16"
java    = "temurin-26.0.2+101"
zellij  = "0.45.1"
pi = "latest"
node  = "26.9.0"

# GitHub release backend: auto-matches platform/arch (e.g. linux_amd64 tarball).
# Install:  mise install olla   (resolve tool name -> github:thushan/olla)
# Upgrade:  mise update && mise install olla
"github:thushan/olla" = "latest"
