# Managed by chezmoi.
#
# Drop-in for /etc/ssh/ssh_config.d, deployed by
# run_once_0_ssh_config.sh to /etc/ssh/ssh_config.d/99-allow-agent-forward.conf.
# It enables SSH agent forwarding for the client. It is only read if
# /etc/ssh/ssh_config contains
#
#     Include /etc/ssh/ssh_config.d/*.conf
#
# which is present by default on Debian/Ubuntu.
#
# The client-side keyword is ForwardAgent (see ssh_config(5)). NOTE:
# AgentForwarding and AllowAgentForwarding are NOT valid here — they are
# sshd_config (server-side) options and the ssh client rejects them
# ("Bad configuration option").
#
# Edit this file to change the desired state. The deployer is run_once
# (chezmoi runs it once, then marks it done); it is idempotent, so editing this
# file and re-running cz apply reinstalls the updated drop-in.

ForwardAgent yes
